<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'" />
    <title>FloatLyrics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="fl" id="fl">
      <div class="fl-bg" id="bg"></div>
      <div class="fl-dim"></div>

      <div class="fl-note" id="note" hidden>This player isn't sharing its position, so timing may be off. In Chrome, reload the FloatLyrics helper extension.</div>

      <div class="fl-body">
        <div class="fl-lines" id="lines"></div>
        <div class="fl-msg" id="msg"></div>
      </div>

      <header class="fl-head fl-glass" id="head">
        <img class="fl-thumb" id="thumb" alt="" />
        <div class="fl-meta"><span class="fl-title" id="title"></span><span class="fl-artist" id="artist"></span></div>
        <button class="fl-icon fl-hover" id="look" type="button" aria-label="Appearance" title="Appearance" aria-expanded="false" aria-controls="pop">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h6m3 0h2M2.5 11h2m3 0h6" /><circle cx="10" cy="5" r="1.6" /><circle cx="6" cy="11" r="1.6" /></svg>
        </button>
        <button class="fl-icon fl-hover" id="min" type="button" aria-label="Minimise to the notch" title="Minimise to the notch (⌘M)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" /></svg>
        </button>
        <button class="fl-icon fl-hover fl-close" id="close" type="button" aria-label="Close FloatLyrics" title="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7" /></svg>
        </button>
      </header>

      <footer class="fl-foot fl-glass" id="foot">
        <button class="fl-icon" id="prev" type="button" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M3.5 3h1.6v10H3.5zM13 3.6v8.8a.6.6 0 0 1-.92.5L5.6 8.5a.6.6 0 0 1 0-1l6.48-4.4a.6.6 0 0 1 .92.5z" /></svg>
        </button>
        <button class="fl-icon fl-play" id="play" type="button" aria-label="Play or pause" title="Play / Pause">
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M4.5 2.9v10.2a.7.7 0 0 0 1.06.6l8.1-5.1a.7.7 0 0 0 0-1.2l-8.1-5.1a.7.7 0 0 0-1.06.6z" /></svg>
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M4 2.5h2.6v11H4zM9.4 2.5H12v11H9.4z" /></svg>
        </button>
        <button class="fl-icon" id="next" type="button" aria-label="Next track" title="Next">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M10.9 3h1.6v10h-1.6zM3 3.6v8.8a.6.6 0 0 0 .92.5l6.48-4.4a.6.6 0 0 0 0-1L3.92 3.1A.6.6 0 0 0 3 3.6z" /></svg>
        </button>
        <span class="fl-sync-group">
          <span class="fl-sep"></span>
          <button class="fl-btn" id="earlier" type="button" title="Show lyrics 0.5s earlier">Earlier</button>
          <span class="fl-sync" id="sync"></span>
          <button class="fl-btn" id="later" type="button" title="Show lyrics 0.5s later">Later</button>
          <button class="fl-btn fl-version" id="version" type="button" hidden></button>
          <button class="fl-btn fl-source" id="source" type="button" hidden></button>
        </span>
      </footer>

      <div class="fl-pop" id="pop" role="dialog" aria-label="Appearance" hidden>
        <div class="fl-pop-row">
          <span class="fl-pop-label">Theme</span>
          <div class="fl-swatches" id="swatches"></div>
        </div>
        <div class="fl-pop-row">
          <span class="fl-pop-label">Text</span>
          <div class="fl-seg">
            <button type="button" id="smaller" aria-label="Smaller text" title="Smaller text"><span class="a-sm">A</span></button>
            <button type="button" id="larger" aria-label="Larger text" title="Larger text"><span class="a-lg">A</span></button>
          </div>
        </div>
        <button class="fl-pop-adv" id="advanced" type="button">Advanced…</button>
      </div>
    </div>

    <script src="../../extension/core.js"></script>
    <script src="../../extension/glass.js"></script>
    <script src="../../node_modules/motion/dist/motion.js"></script>
    <script src="looks.js"></script>
    <script src="view.js"></script>
  </body>
</html>
