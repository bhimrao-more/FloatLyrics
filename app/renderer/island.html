<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'" />
    <title>FloatLyrics Island</title>
    <link rel="stylesheet" href="island.css" />
  </head>
  <body>
    <div class="island" id="island" data-state="hidden">
      <div class="shell">
        <div class="gbg" id="gbg"></div>
        <div class="gdim"></div>
        <div class="top">
          <div class="disc" id="disc" title="Open FloatLyrics">
            <span class="ring" id="ring"></span>
            <img class="art" id="art" alt="" />
          </div>
          <div class="end">
            <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <button type="button" class="resume" id="resume" aria-label="Play" title="Play">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.9v10.2a.7.7 0 0 0 1.06.6l8.1-5.1a.7.7 0 0 0 0-1.2l-8.1-5.1a.7.7 0 0 0-1.06.6z" /></svg>
            </button>
          </div>
        </div>
        <div class="lyric" id="lyric" aria-live="polite">
          <div class="reel" id="reel"></div>
          <div class="pmeta" id="pmeta"><span class="pt" id="ptitle"></span><span class="pa" id="partist"></span></div>
        </div>
        <div class="more">
          <div class="meta"><span class="title" id="title"></span><span class="artist" id="artist"></span></div>
          <div class="controls">
            <button type="button" id="prev" aria-label="Previous track" title="Previous">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3h1.6v10H3.5zM13 3.6v8.8a.6.6 0 0 1-.92.5L5.6 8.5a.6.6 0 0 1 0-1l6.48-4.4a.6.6 0 0 1 .92.5z" /></svg>
            </button>
            <button type="button" id="play" class="play" aria-label="Play or pause" title="Play / Pause">
              <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.9v10.2a.7.7 0 0 0 1.06.6l8.1-5.1a.7.7 0 0 0 0-1.2l-8.1-5.1a.7.7 0 0 0-1.06.6z" /></svg>
              <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h2.6v11H4zM9.4 2.5H12v11H9.4z" /></svg>
            </button>
            <button type="button" id="next" aria-label="Next track" title="Next">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.9 3h1.6v10h-1.6zM3 3.6v8.8a.6.6 0 0 0 .92.5l6.48-4.4a.6.6 0 0 0 0-1L3.92 3.1A.6.6 0 0 0 3 3.6z" /></svg>
            </button>
            <span class="nudges">
              <button type="button" id="earlier" class="nudge" title="Show lyrics 0.5s earlier">Earlier</button>
              <button type="button" id="later" class="nudge" title="Show lyrics 0.5s later">Later</button>
            </span>
            <button type="button" id="open" class="open" aria-label="Open the lyrics window" title="Open the lyrics window">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path class="stroke" d="M6 3H3.8A.8.8 0 0 0 3 3.8v8.4a.8.8 0 0 0 .8.8h8.4a.8.8 0 0 0 .8-.8V10M9 3h4v4M13 3L7.5 8.5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="measure" id="measure" aria-hidden="true"></div>

    <script src="../../extension/core.js"></script>
    <script src="../../node_modules/motion/dist/motion.js"></script>
    <script src="looks.js"></script>
    <script src="island.js"></script>
  </body>
</html>
