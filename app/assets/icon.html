<!doctype html>
<!-- FloatLyrics app icon source: a CD with a rainbow sheen, and a frosted glass lyric bar across it.
     Rendered to icon.png / icon.icns by scripts/make-icon.mjs (Chromium, 1024×1024, transparent outside the tile).
     macOS icon grid: an 824×824 tile with 185px corners, centred. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }
      .tile {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 824px;
        height: 824px;
        border-radius: 185px;
        overflow: hidden;
        background:
          radial-gradient(60% 55% at 18% 12%, rgba(255, 122, 89, 0.85), transparent 70%),
          radial-gradient(55% 55% at 92% 22%, rgba(178, 87, 255, 0.8), transparent 70%),
          radial-gradient(70% 60% at 35% 105%, rgba(47, 123, 255, 0.9), transparent 70%),
          radial-gradient(45% 45% at 100% 100%, rgba(255, 79, 154, 0.6), transparent 70%),
          linear-gradient(160deg, #3a1d5e, #0f1d45);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32), inset 0 2px 0 rgba(255, 255, 255, 0.28), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }

      /* The disc */
      .cd {
        position: absolute;
        left: 132px;
        top: 96px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, #eef1f7 0 22%, #d5dae4 40%, #b9c0cd 70%, #a3abba 100%);
        box-shadow: 0 26px 50px rgba(8, 4, 30, 0.55), inset 0 0 0 3px rgba(255, 255, 255, 0.75), inset 0 0 0 7px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      .cd::before {
        /* rainbow diffraction */
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 200deg,
          rgba(255, 0, 140, 0.55),
          rgba(255, 190, 0, 0.55),
          rgba(0, 240, 170, 0.5),
          rgba(0, 150, 255, 0.6),
          rgba(170, 60, 255, 0.55),
          rgba(255, 0, 140, 0.55)
        );
        mix-blend-mode: color;
      }
      .cd::after {
        /* light catching the surface: two bright rays */
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          conic-gradient(from 20deg, transparent 0 4%, rgba(255, 255, 255, 0.85) 9%, transparent 15% 50%, rgba(255, 255, 255, 0.7) 58%, transparent 64%),
          repeating-radial-gradient(circle, rgba(255, 255, 255, 0.05) 0 2px, rgba(0, 0, 0, 0.035) 2px 5px);
        mix-blend-mode: soft-light;
      }
      .hub {
        /* the clear plastic ring around the hole */
        position: absolute;
        left: 50%;
        top: 50%;
        width: 196px;
        height: 196px;
        translate: -50% -50%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0 40%, rgba(255, 255, 255, 0.45) 41% 44%, rgba(220, 226, 238, 0.55) 45% 100%);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.08);
        z-index: 2;
      }
      .hole {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 62px;
        height: 62px;
        translate: -50% -50%;
        border-radius: 50%;
        background: linear-gradient(160deg, #2b1d55, #182a63);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(255, 255, 255, 0.55);
        z-index: 3;
      }

      /* The lyric: a frosted glass bar across the bottom of the disc */
      .glass {
        position: absolute;
        left: 92px;
        top: 540px;
        width: 640px;
        height: 176px;
        border-radius: 88px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.12));
        backdrop-filter: blur(22px) saturate(1.6);
        box-shadow: 0 20px 44px rgba(10, 6, 32, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.7), inset 0 -2px 0 rgba(255, 255, 255, 0.15),
          inset 0 0 0 2px rgba(255, 255, 255, 0.25);
      }
      .line {
        position: absolute;
        left: 50%;
        translate: -50% 0;
        border-radius: 999px;
        background: #fff;
      }
      .line.now {
        top: 52px;
        width: 420px;
        height: 44px;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.65);
      }
      .line.next {
        top: 116px;
        width: 260px;
        height: 26px;
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="cd"><div class="hub"></div><div class="hole"></div></div>
      <div class="glass"><div class="line now"></div><div class="line next"></div></div>
    </div>
  </body>
</html>
